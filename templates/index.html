<!DOCTYPE html>
<html>
<head>
    <title>Adopt Me Trade Bot</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: #1a1a1a; color: #eee; margin: 0; padding: 20px; }
        .container { max-width: 1300px; margin: 0 auto; }
        h1 { color: #3dd4ff; margin: 0 0 5px; }
        .subtitle { color: #888; margin-bottom: 20px; font-size: 14px; }

        .toolbar {
            position: sticky; top: 0; background: #1a1a1a; padding: 15px 0;
            z-index: 100; border-bottom: 1px solid #333; margin-bottom: 15px;
        }
        .search-box {
            width: 100%; padding: 12px; font-size: 16px;
            background: #2a2a2a; color: #eee; border: 1px solid #444; border-radius: 8px;
        }
        .inventory-bar {
            display: flex; gap: 15px; align-items: center; margin-top: 10px;
            color: #aaa; font-size: 14px;
        }
        .inventory-count { color: #00ff88; font-weight: bold; font-size: 16px; }
        button.submit {
            background: #00ff88; color: #111; border: none; padding: 12px 30px;
            font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-left: auto;
        }
        button.submit:disabled { background: #333; color: #666; cursor: not-allowed; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
        .card {
            background: #222; border-radius: 10px; padding: 10px; text-align: center;
            cursor: pointer; transition: background 0.15s, box-shadow 0.15s;
            border: 2px solid transparent;
        }
        .card:hover { background: #2a2a2a; }
        .card.selected { background: #1a3a2a; border-color: #00ff88; }
        .card img {
            width: 72px; height: 72px; object-fit: contain;
            border-radius: 8px; background: #111; margin-bottom: 6px;
            filter: grayscale(1) opacity(0.5); transition: filter 0.15s;
        }
        .card.selected img { filter: none; }
        .pet-name { font-size: 12px; font-weight: 600; margin-bottom: 6px; height: 32px;
                    display: flex; align-items: center; justify-content: center; line-height: 1.2; }
        .toggles { display: flex; justify-content: center; gap: 3px; margin-bottom: 6px; }
        .toggle {
            width: 26px; height: 26px; border-radius: 5px; border: 2px solid #444;
            background: #111; color: #666; font-weight: bold; cursor: pointer;
            font-size: 11px; padding: 0;
        }
        .toggle:hover { border-color: #666; }
        .toggle.on.fly  { background: #039ad6; color: #fff; border-color: #039ad6; }
        .toggle.on.ride { background: #fb0279; color: #fff; border-color: #fb0279; }
        .toggle.on.neon { background: #8dc53e; color: #fff; border-color: #8dc53e; }
        .toggle.on.mega { background: #a855f7; color: #fff; border-color: #a855f7; }
        .value { color: #ff9900; font-weight: bold; font-size: 13px; min-height: 18px; }
        .value.empty { color: #444; }
    </style>
<meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/static/theme.css">
</head>
<body>
    <div class="container">
        <div class="brand">TRADE DESK / ADOPT ME</div><h1>Your inventory. Better opportunities.</h1>
        <p class="subtitle">Click a pet to select it. Use F/R/N/M buttons to specify the variant. Click again to deselect.</p>

        <form method="POST" action="/find" id="search-form">
            <input type="hidden" name="target_pet" id="focus-hidden"><section class="focus-panel" id="focus-picker"></section>
            <input type="hidden" name="inventory" id="inventory-input">
            <div class="toolbar">
                <input type="text" id="search" class="search-box" placeholder="Search pets... (e.g. frost, bat, shadow)">
                <div class="inventory-bar">
                    <span>Inventory: <span class="inventory-count" id="inv-count">0</span> pets</span>
                    <button type="submit" class="submit" id="submit-btn" disabled>Find Trades</button>
                </div>
            </div>

            <div class="grid" id="pet-grid">
                {% for pet in pets %}
                <div class="card" data-base="{{ pet.name }}" data-search="{{ pet.name|lower }}">
                    <img src="{{ pet.image }}" alt="{{ pet.name }}" loading="lazy"
                         onerror="this.src='https://amvgg.com/item-not-found.png'">
                    <div class="pet-name">{{ pet.name }}</div>
                    <div class="toggles" onclick="event.stopPropagation()">
                        <button type="button" class="toggle fly"  data-var="fly">F</button>
                        <button type="button" class="toggle ride" data-var="ride">R</button>
                        <button type="button" class="toggle neon" data-var="neon">N</button>
                        <button type="button" class="toggle mega" data-var="mega">M</button>
                    </div>
                    <div class="value empty">—</div>
                </div>
                {% endfor %}
            </div>
        </form>
    </div>

<script>
const PET_DATA = {{ pets|tojson }};
const BY_BASE = {};
for (const p of PET_DATA) BY_BASE[p.name] = p.variants;

// ── State ──────────────────────────────────────────────────────────
const STORAGE_KEY = "adoptme_inventory";
// baseStates: {baseName: {selected, fly, ride, neon, mega}}
let baseStates = loadStates();

function loadStates() {
    const inv = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    const st = {};
    for (const variant of inv) {
        // Find base: longest prefix matching a known base
        let base = null;
        for (const b of Object.keys(BY_BASE)) {
            if ((variant === b || variant.startsWith(b + " ")) && (!base || b.length > base.length)) base = b;
        }
        if (!base) continue;
        const rest = variant === base ? "" : variant.substring(base.length + 1);
        st[base] = {
            selected: true,
            fly:  rest.includes("Fly"),
            ride: rest.includes("Ride"),
            neon: rest.includes("Neon"),
            mega: rest.includes("Mega"),
        };
    }
    return st;
}

function stateFor(base) {
    if (!baseStates[base]) baseStates[base] = { selected: false, fly: false, ride: false, neon: false, mega: false };
    return baseStates[base];
}

function suffixOf(st) {
    let s = "";
    if (st.fly)  s += " Fly";
    if (st.ride) s += " Ride";
    if (st.mega) s += " Mega";
    else if (st.neon) s += " Neon";
    return s.trim();
}

function variantName(base, st) {
    const suf = suffixOf(st);
    return suf ? base + " " + suf : base;
}

function getInventory() {
    const out = [];
    for (const [base, st] of Object.entries(baseStates)) {
        if (st.selected) out.push(variantName(base, st));
    }
    return out;
}

function saveAndRefresh() {
    const inv = getInventory();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(inv));
    document.getElementById("inv-count").textContent = inv.length;
    document.getElementById("submit-btn").disabled = inv.length === 0;
}

// ── Attach to each card ────────────────────────────────────────────
document.querySelectorAll(".card").forEach(card => {
    const base = card.dataset.base;
    const variants = BY_BASE[base] || {};

    function render() {
        const st = stateFor(base);
        card.classList.toggle("selected", st.selected);
        card.querySelector(".fly").classList.toggle("on",  st.fly);
        card.querySelector(".ride").classList.toggle("on", st.ride);
        card.querySelector(".neon").classList.toggle("on", st.neon);
        card.querySelector(".mega").classList.toggle("on", st.mega);

        const valEl = card.querySelector(".value");
        if (st.selected) {
            const v = variants[suffixOf(st)];
            if (v !== undefined) {
                valEl.textContent = v.toFixed(2) + " frost";
                valEl.classList.remove("empty");
            } else {
                valEl.textContent = "—";
                valEl.classList.add("empty");
            }
        } else {
            valEl.textContent = "—";
            valEl.classList.add("empty");
        }
        saveAndRefresh();
    }

    // Click card body (not toggles) → toggle selection
    card.addEventListener("click", () => {
        const st = stateFor(base);
        st.selected = !st.selected;
        if (!st.selected) { st.fly = st.ride = st.neon = st.mega = false; }
        render();
    });

    // Toggle buttons
    card.querySelector(".fly").addEventListener("click", () => {
        const st = stateFor(base);
        st.selected = true; st.fly = !st.fly; render();
    });
    card.querySelector(".ride").addEventListener("click", () => {
        const st = stateFor(base);
        st.selected = true; st.ride = !st.ride; render();
    });
    card.querySelector(".neon").addEventListener("click", () => {
        const st = stateFor(base);
        st.selected = true; st.neon = !st.neon; if (st.neon) st.mega = false; render();
    });
    card.querySelector(".mega").addEventListener("click", () => {
        const st = stateFor(base);
        st.selected = true; st.mega = !st.mega; if (st.mega) st.neon = false; render();
    });

    render();
});

// ── Search filter ─────────────────────────────────────────────────
document.getElementById("search").addEventListener("input", (e) => {
    const q = e.target.value.toLowerCase().trim();
    document.querySelectorAll(".card").forEach(card => {
        card.style.display = (!q || card.dataset.search.includes(q)) ? "" : "none";
    });
});

// ── Submit ────────────────────────────────────────────────────────
document.getElementById("search-form").addEventListener("submit", () => {
    document.getElementById("inventory-input").value = JSON.stringify(getInventory());
});
</script>
<script src="/static/target.js"></script></body>
</html>
