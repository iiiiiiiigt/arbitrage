<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your inventory · Trade Desk</title><link rel="stylesheet" href="/static/inventory.css"></head><body>
<main class="inventory-app"><nav><a class="brand" href="/">◈ TRADE DESK</a><a href="/catalog">Catalog checker ↗</a></nav>
<header><span class="eyebrow">YOUR COLLECTION</span><h1>Build your inventory.</h1><p>Pick a pet. Set its variant. Add the copies you own.</p></header>
<form id="search-form" method="POST" action="/find"><input type="hidden" name="inventory" id="inventory-input"><div class="workspace">
<section class="browser"><div class="searchbar"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Search pets by name…" aria-label="Search pets"><button id="owned-filter" type="button" aria-pressed="false">Owned only</button></div><div class="section-heading"><h2>Choose a pet</h2><span id="match-count"></span></div><div id="pet-grid" class="pet-grid"></div><button id="show-more" type="button" class="secondary">Show more pets</button></section>
<aside><section id="editor" class="panel"><div id="editor-empty"><span class="empty-icon">＋</span><h2>Start with a pet</h2><p>Select one on the left to choose its variant and quantity.</p></div><div id="editor-content" hidden><div class="editor-heading"><img id="editor-image" alt=""><div><span class="eyebrow">ADD TO INVENTORY</span><h2 id="editor-name"></h2></div></div><label class="field-label">Abilities</label><div class="toggle-row"><button type="button" data-mod="Fly" aria-pressed="false">Fly</button><button type="button" data-mod="Ride" aria-pressed="false">Ride</button></div><label class="field-label">Appearance <span>Leave both off for normal</span></label><div class="toggle-row"><button type="button" data-mod="Neon" aria-pressed="false">Neon</button><button type="button" data-mod="Mega" aria-pressed="false">Mega</button></div><div class="quantity-line"><label for="quantity">Copies to add</label><div class="stepper"><button id="qty-minus" type="button" aria-label="Decrease copies">−</button><input id="quantity" type="number" min="1" max="999" value="1" aria-label="Copies to add"><button id="qty-plus" type="button" aria-label="Increase copies">+</button></div></div><p id="variant-preview"></p><button id="add-pet" class="primary" type="button">Add to inventory</button></div></section>
<section class="panel collection"><div class="section-heading"><h2>Your inventory</h2><span><b id="inv-count">0</b> pets</span></div><p id="save-status" role="status">Saved on this browser</p><div id="owned-list"></div></section>
<section class="scan-panel"><label class="checkbox"><input id="mode-all" name="mode" value="all" type="checkbox"> Explore all pets, including ones I don’t own</label><button id="submit-btn" type="submit" class="primary" disabled>Find trades →</button></section></aside></div></form></main>
<script>const PET_DATA = {{ pets|tojson }};</script><script src="/static/inventory.js"></script></body></html>
