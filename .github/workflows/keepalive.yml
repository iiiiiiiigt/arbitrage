name: Keepalive

# GitHub automatically disables scheduled workflows in a public repository
# after 60 days with no repository activity. The publish workflow only deploys
# (it never pushes), so without this the dashboard would silently stop
# refreshing with no error anywhere. See:
# https://docs.github.com/en/actions/how-tos/manage-workflow-runs/disable-and-enable-workflows

on:
  schedule:
    # Weekly, off the top of the hour.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Touch keepalive stamp
        run: |
          mkdir -p .github
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .github/keepalive
          cat .github/keepalive

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          if git diff --quiet --cached; then
            echo "No change; skipping commit."
            exit 0
          fi
          git commit -m "chore: keepalive $(date -u +%Y-%m-%d)"
          git push
